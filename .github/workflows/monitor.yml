name: refresh-monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch ares
        env:
          ARES_USER: tzqbwg
          ARES_PASS: jumor.cn
        run: python scripts/scrape_ares.py
      - name: commit
        run: |
          git config user.name 'museum-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add monitor.json
          git diff --cached --quiet && echo 'no change' || (git commit -m "monitor $(date -u +%Y%m%d-%H%M)" && git push)
